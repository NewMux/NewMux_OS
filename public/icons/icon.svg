<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4FA3FF"/>
      <stop offset="0.55" stop-color="#1F5FE0"/>
      <stop offset="1" stop-color="#1636A8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="0.85" cy="1" r="0.7">
      <stop offset="0" stop-color="#5E3BE0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5E3BE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
